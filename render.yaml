# Render Blueprint Configuration for Enterprise ERP + CRM Stack
# Deploy PostgreSQL Database, Backend Express Web Service, and Frontend Static Site

services:
  # 1. Backend Web Service (Node.js + Express + Prisma)
  - type: web
    name: erp-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build && npx prisma db push && npx prisma db seed
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: erp-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: NODE_ENV
        value: production

  # 2. Frontend Static Site (React 18 + Vite)
  - type: static
    name: erp-frontend
    env: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: erp-backend
          property: url

databases:
  # 3. PostgreSQL Database
  - name: erp-db
    databaseName: erp_crm_db
    user: erp_user
    plan: free
